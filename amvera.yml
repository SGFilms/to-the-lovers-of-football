# Настройка для Amvera (amvera.ru): бот собирается из Dockerfile в корне репозитория.
# docker-compose.yml и Caddy там не используются: базу даёт управляемый PostgreSQL Amvera,
# а HTTPS — домен проекта в Amvera. Подробно — в README, раздел «Хостинг в Amvera».
meta:
  environment: docker
  toolchain:
    name: docker

build:
  dockerfile: Dockerfile

run:
  # Порт встроенного веб-сервера бота (WEB_PORT): /health, уведомления ЮKassa, оферта.
  containerPort: 8080
