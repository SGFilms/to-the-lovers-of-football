# Локально:      docker compose up --build
# На сервере:    docker compose --profile prod up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Файл базы SQLite (/data/lflbot.db) живёт в томе и переживает пересборку контейнера.
      - bot-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  bot-data:
  caddy_data:
  caddy_config:
