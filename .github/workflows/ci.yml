name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lflbot:ci .
      - name: Migrations and permissions in image
        # Как entrypoint.sh: папку базы получает пользователь bot, миграции идут от его имени.
        run: >-
          docker run --rm --tmpfs /data lflbot:ci sh -c
          'chown bot:bot /data && openssl version &&
          setpriv --reuid=bot --regid=bot --init-groups sh -c "alembic upgrade head && test -s /data/lflbot.db"'
